<!DOCTYPE html>
<html>
<head>
    <title>Insights - Sokoshamba</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <div class="logo">Sokoshamba</div>
</header>

<section class="section">
    <h2>Market Insights</h2>
    <canvas id="priceChart" width="600" height="400"></canvas>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.1.0/dist/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://fnknhyscommezhfgnpqx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Nu7xh1es0Kt9Ccv6sn2KqA_ptOJZQNm";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadInsights() {
    const { data, error } = await supabase.from('produce').select('*');
    if(error) console.error(error);
    else {
      const labels = data.map(p => p.name);
      const prices = data.map(p => p.price);

      const ctx = document.getElementById('priceChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Price (KES)',
            data: prices,
            backgroundColor: 'rgba(54, 162, 235, 0.5)'
          }]
        },
        options: { responsive: true }
      });
    }
  }

  loadInsights();
</script>

</body>
</html>
